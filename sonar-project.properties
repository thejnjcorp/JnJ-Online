sonar.projectKey=jnj-online
sonar.projectName=JnJ Online
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=src,tst,firebase/test
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,firebase/test/**

sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,design/**,.github/**,.scannerwork/**,**/*.json,**/*.md,**/*.log

# Generated by `npm run test:tst:coverage` (see scripts/sonar-scan.sh, which
# runs it before invoking the scanner). Covers all of src/ against tst/'s
# suite - low today since tst/ only covers a handful of files so far, not a
# sign the report path is misconfigured.
sonar.javascript.lcov.reportPaths=coverage/tst/lcov.info
