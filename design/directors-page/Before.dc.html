<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #16161a; --bg-sunken: #101013; --bg-raised: #1f1f25;
      --border: #34343f; --text: #ece8e1; --text-muted: #a09a90;
      --accent: #c8a24a; --on-accent: #16161a;
      --font-display: 'Cinzel', Georgia, serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); }
  </style>
</helmet>

<div style="width:100%;min-height:1020px;display:flex;flex-direction:row;background:var(--bg);">

  <!-- ============ SKILLS SIDEBAR (real: rgb(73,73,73) shell + rgb(0,0,78) trigger, but the
       SkillsAndFlaws cards nested inside ARE already properly DarkArcane-themed today -
       this is the mismatch: good inner cards, clashing outer chrome. ============ -->
  <div style="width:300px;min-width:300px;height:960px;background:rgb(73,73,73);overflow-y:auto;display:flex;flex-direction:column;align-items:flex-start;">
    <div style="width:100%;background:rgb(0,0,78);color:#fff;padding:10px 14px;font-size:14px;">Kessa Vane</div>
    <div style="width:100%;padding:10px 0;display:flex;flex-direction:column;">
      <div style="margin:6px 14px;padding:10px;border:1px solid var(--accent);border-radius:10px;background:#1f1f25;color:#ece8e1;display:flex;align-items:center;gap:8px;">
        <span style="color:#6f6a63;font-size:20px;line-height:1;">&rsaquo;</span>
        <span style="flex:1;font-size:15px;">Shakedown</span>
        <span style="display:flex;">
          <svg viewBox="0 0 24 24" width="14" height="14" style="filter:invert(1);"><path fill="#fff" d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.6 6.7L12 16.9l-6.2 3.4 1.6-6.7L2.2 9l6.9-.7L12 2z"/></svg>
        </span>
      </div>
      <div style="margin:6px 14px;padding:10px;border:1px solid var(--accent);border-radius:10px;background:#1f1f25;color:#ece8e1;display:flex;align-items:center;gap:8px;">
        <span style="color:#6f6a63;font-size:20px;line-height:1;">&rsaquo;</span>
        <span style="flex:1;font-size:15px;">Scrambler's Instinct</span>
      </div>
      <div style="margin:6px 14px;padding:10px;border:1px solid #c9453f;border-radius:10px;background:#1f1f25;color:#ece8e1;display:flex;align-items:center;gap:8px;">
        <span style="color:#6f6a63;font-size:20px;line-height:1;">&rsaquo;</span>
        <span style="flex:1;font-size:15px;">Fade Into the Crowd</span>
      </div>
    </div>
    <div style="width:100%;background:rgb(0,0,78);color:#fff;padding:10px 14px;font-size:14px;">Bram Oskar</div>
    <div style="width:100%;padding:10px 0;display:flex;flex-direction:column;">
      <div style="margin:6px 14px;padding:10px;border:1px solid var(--accent);border-radius:10px;background:#1f1f25;color:#ece8e1;display:flex;align-items:center;gap:8px;">
        <span style="color:#6f6a63;font-size:20px;line-height:1;">&rsaquo;</span>
        <span style="flex:1;font-size:15px;">Iron Stomach</span>
      </div>
      <div style="margin:6px 14px;padding:10px;border:1px solid var(--accent);border-radius:10px;background:#1f1f25;color:#ece8e1;display:flex;align-items:center;gap:8px;">
        <span style="color:#6f6a63;font-size:20px;line-height:1;">&rsaquo;</span>
        <span style="flex:1;font-size:15px;">Steady Hands</span>
      </div>
    </div>
  </div>

  <!-- ============ MAIN BODY ============ -->
  <div style="flex:1;min-width:0;padding:24px 28px;">

    <!-- Tab switcher is a shared real component, already themed - not part of the problem -->
    <div style="display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--bg-sunken);width:max-content;margin-bottom:18px;">
      <button style="padding:9px 18px;border:none;border-radius:999px;font-size:13.5px;font-weight:600;background:transparent;color:var(--text-muted);">Roleplay</button>
      <button style="padding:9px 18px;border:none;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--accent);color:var(--on-accent);">Combat</button>
      <button style="padding:9px 18px;border:none;border-radius:999px;font-size:13.5px;font-weight:600;background:transparent;color:var(--text-muted);">Maps</button>
    </div>

    <!-- Combat tab: this is the clunky part - three raw rgb() boxes, no theme tokens -->
    <div style="display:flex;flex-direction:row;justify-content:space-between;gap:0;">

      <!-- Player Stats: rgb(1,70,49) -->
      <div style="width:420px;height:900px;background:rgb(1,70,49);border-radius:10px;margin-left:16px;margin-top:9px;overflow-y:auto;padding:10px;color:#fff;font-family:sans-serif;">
        Player Stats<br/><br/>

        <div style="width:100%;background:rgb(0,151,25);border-radius:10px;margin-bottom:10px;padding-bottom:10px;">
          <div style="width:100%;text-align:center;padding:8px;font-size:14px;">Kessa Vane</div>
          <div style="display:flex;justify-content:center;">
            <div style="width:390px;background:rgba(0,0,0,0.3);border-radius:10px;display:flex;flex-direction:row;justify-content:center;padding:10px;gap:14px;">
              <div style="text-align:center;">
                <div style="position:relative;width:70px;height:80px;">
                  <svg viewBox="0 0 24 24" width="70" height="80" fill="none" stroke="#fff" stroke-width="1.5" style="filter:sepia(1) saturate(8) hue-rotate(120deg);"><path d="M3 10.4V5.7c0-1.6.4-2.1 4.3-3.4L9 1.7C10.4 1.3 11.2 1 12 1s1.6.3 3 .7l1.7.6c3.9 1.3 4.3 1.8 4.3 3.4v4.7c0 6-4.5 8.9-7.4 10.2-.7.3-1.1.4-1.6.4s-.9-.1-1.6-.4C7.5 19.3 3 16.4 3 10.4Z"/></svg>
                  <div style="position:absolute;inset:0;top:26px;text-align:center;font-size:28px;color:#fff;">17</div>
                </div>
                <div style="display:flex;gap:4px;margin-top:6px;">
                  <div style="width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.15);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;">17</div>
                  <div style="width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.15);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;">17</div>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;gap:6px;"><div style="width:90px;height:30px;border-radius:8px;background:rgba(255,255,255,0.12);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;">XP 0</div></div>
                <div style="display:flex;gap:6px;"><div style="width:115px;height:30px;border-radius:8px;background:rgba(255,255,255,0.12);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;">Hardness 0</div></div>
                <div style="display:flex;gap:6px;">
                  <div style="width:40px;height:30px;border-radius:8px;background:rgba(255,255,255,0.12);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;">3</div>
                  <div style="width:40px;height:30px;border-radius:8px;background:rgba(255,255,255,0.12);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;">1</div>
                  <div style="width:40px;height:30px;border-radius:8px;background:rgba(255,255,255,0.12);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;">0</div>
                  <div style="width:40px;height:30px;border-radius:8px;background:rgba(255,255,255,0.12);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;">3</div>
                </div>
              </div>
            </div>
          </div>
          <div style="text-align:center;margin-top:10px;font-size:13px;color:#fff;">Action Points: ☆ ☆ ☆ ☆ <span style="margin-left:10px;padding:6px 14px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-size:12px;">Next Turn</span></div>
        </div>

        <div style="width:100%;background:rgb(0,151,25);border-radius:10px;padding:10px;text-align:center;font-size:14px;">Bram Oskar</div>
      </div>

      <!-- Combat Tracker: rgb(116,85,0) -->
      <div style="width:320px;height:900px;background:rgb(116,85,0);border-radius:10px;margin-top:9px;padding:10px;color:#fff;font-family:sans-serif;">
        Combat Tracker<br/><br/>
        <div style="background:rgba(0,0,0,0.25);border:2px solid #999;border-radius:4px;height:200px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px;">Zone 0</div>
        <div style="background:rgba(0,0,0,0.25);border:2px solid #999;border-radius:4px;height:200px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px;">Zone 1</div>
      </div>

      <!-- Enemy Stats: rgb(153,50,50) -->
      <div style="width:420px;height:900px;background:rgb(153,50,50);border-radius:10px;margin-right:16px;margin-top:9px;overflow-y:auto;padding:10px;color:#fff;font-family:sans-serif;">
        Enemy Stats<br/><br/>
        <div style="width:100%;background:rgb(221,162,0);border-radius:10px;padding:10px;text-align:center;font-size:14px;">GUNMECH Leo Lvl 3</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
